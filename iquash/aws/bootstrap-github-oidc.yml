AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC role for dnawebai/coolify iQuash AWS deployment

Parameters:
  GitHubOrg:
    Type: String
    Default: dnawebai
  GitHubRepo:
    Type: String
    Default: coolify

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubTerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: iquash-coolify-github-terraform
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: iquash-ec2-ssm-install
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - arn:aws:ec2:us-east-2:821579665709:instance/i-0858e36651e5bf954
                  - arn:aws:ssm:us-east-2::document/AWS-RunShellScript

Outputs:
  RoleArn:
    Description: Store this value as GitHub secret AWS_IQUASH_TERRAFORM_ROLE_ARN
    Value: !GetAtt GitHubTerraformRole.Arn
