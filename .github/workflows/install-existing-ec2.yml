name: Install iQuash OCR on Existing EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IQUASH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_IQUASH_REGION }}

      - name: Ensure SSM install permission
        run: |
          set -euo pipefail
          cat > /tmp/iquash-ssm-policy.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[
              {
                "Effect":"Allow",
                "Action":[
                  "ssm:DescribeInstanceInformation",
                  "ssm:GetCommandInvocation",
                  "ssm:ListCommandInvocations",
                  "ssm:ListCommands"
                ],
                "Resource":"*"
              },
              {
                "Effect":"Allow",
                "Action":"ssm:SendCommand",
                "Resource":[
                  "arn:aws:ec2:${{ vars.AWS_IQUASH_REGION }}:${{ vars.AWS_IQUASH_ACCOUNT_ID }}:instance/${{ vars.AWS_IQUASH_INSTANCE_ID }}",
                  "arn:aws:ssm:${{ vars.AWS_IQUASH_REGION }}::document/AWS-RunShellScript"
                ]
              }
            ]
          }
          JSON
          aws iam put-role-policy             --role-name iquash-coolify-github-terraform             --policy-name iquash-ssm-install             --policy-document file:///tmp/iquash-ssm-policy.json

      - name: Verify EC2 and SSM readiness
        run: |
          set -euo pipefail
          aws ec2 describe-instances             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --query 'Reservations[0].Instances[0].{State:State.Name,Platform:PlatformDetails,PrivateIp:PrivateIpAddress,PublicIp:PublicIpAddress}'             --output table
          STATUS="$(aws ssm describe-instance-information             --filters "Key=InstanceIds,Values=${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --query 'InstanceInformationList[0].PingStatus'             --output text)"
          test "$STATUS" = "Online"

      - name: Install or update Coolify from dnawebai fork
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Install iQuash Coolify host"             --parameters 'commands=["set -euxo pipefail","export DEBIAN_FRONTEND=noninteractive","if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y git curl ca-certificates; elif command -v dnf >/dev/null 2>&1; then dnf install -y git curl ca-certificates; elif command -v yum >/dev/null 2>&1; then yum install -y git curl ca-certificates; fi","mkdir -p /opt/dnawebai","if [ -d /opt/dnawebai/coolify/.git ]; then git -C /opt/dnawebai/coolify fetch origin main && git -C /opt/dnawebai/coolify reset --hard origin/main; else git clone --depth 1 https://github.com/dnawebai/coolify.git /opt/dnawebai/coolify; fi","chmod +x /opt/dnawebai/coolify/scripts/install.sh","/opt/dnawebai/coolify/scripts/install.sh"]'             --query 'Command.CommandId'             --output text)"
          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}"
          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'             --output json

      - name: Verify Coolify containers
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Verify Coolify"             --parameters 'commands=["set -e","docker --version","docker ps --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"","curl -fsS http://127.0.0.1:8000 >/dev/null || true"]'             --query 'Command.CommandId'             --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --output json
