name: Deploy iQuash OCR Services

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IQUASH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_IQUASH_REGION }}

      - name: Build and start OCR services
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Deploy iQuash PaddleOCR and Docling"             --timeout-seconds 5400             --parameters 'commands=["set -eu","git -C /opt/dnawebai/coolify fetch origin main","git -C /opt/dnawebai/coolify reset --hard origin/main","cd /opt/dnawebai/coolify/iquash","docker compose -f docker-compose.ocr.yml build paddleocr","docker compose -f docker-compose.ocr.yml up -d paddleocr","docker compose -f docker-compose.ocr.yml build docling","docker compose -f docker-compose.ocr.yml up -d docling","docker ps --filter name=iquash- --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\""]'             --query 'Command.CommandId'             --output text)"
          echo "SSM command: $COMMAND_ID"
          for i in $(seq 1 360); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --query Status --output text 2>/dev/null || true)"
            echo "[$i] $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 10
          done
          RESULT="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --output json)"
          echo "$RESULT"
          STATUS="$(echo "$RESULT" | jq -r .Status)"
          test "$STATUS" = "Success"

      - name: Verify HTTPS health
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            P="$(curl -fsS --max-time 10 https://ocr.3-19-77-120.sslip.io/health || true)"
            D="$(curl -fsS --max-time 10 https://docling.3-19-77-120.sslip.io/health || true)"
            echo "PaddleOCR: $P"
            echo "Docling: $D"
            if echo "$P" | grep -q '"ok":true' && echo "$D" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 15
          done
          exit 1
