name: Inspect iQuash Proxy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IQUASH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_IQUASH_REGION }}
      - name: Inspect Traefik
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Inspect Coolify Traefik"             --parameters 'commands=["echo ---CMD---","docker inspect coolify-proxy --format \"{{json .Config.Cmd}}\"","echo ---LABELS---","docker inspect coolify-proxy --format \"{{json .Config.Labels}}\"","echo ---MOUNTS---","docker inspect coolify-proxy --format \"{{json .Mounts}}\"","echo ---FILES---","find /data/coolify/proxy -maxdepth 3 -type f -print","echo ---CONFIGS---","for f in $(find /data/coolify/proxy -maxdepth 3 -type f); do echo ==== $f; sed -n \"1,220p\" $f; done"]'             --query 'Command.CommandId'             --output text)"
          for i in $(seq 1 30); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --query Status --output text)"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then break; fi
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --output json
