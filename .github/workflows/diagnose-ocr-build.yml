name: Diagnose iQuash OCR Build

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IQUASH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_IQUASH_REGION }}
      - name: Diagnose OCR build
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Diagnose iQuash OCR build"             --parameters 'commands=["echo ---CONTAINERS---","docker ps -a --format \"table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}\"","echo ---IMAGES---","docker images --format \"table {{.Repository}}\\t{{.Tag}}\\t{{.Size}}\\t{{.CreatedSince}}\" | head -80","echo ---PROCESSES---","ps -eo pid,ppid,etime,%cpu,%mem,cmd --sort=-%cpu | head -60","echo ---MEMORY---","free -h","echo ---DISK---","df -h / /var/lib/docker","echo ---DOCKER-DISK---","docker system df"]'             --query 'Command.CommandId'             --output text)"
          for i in $(seq 1 30); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --query Status --output text 2>/dev/null || true)"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then break; fi
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --output json
