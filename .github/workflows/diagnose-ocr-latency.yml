name: Diagnose iQuash OCR Latency

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IQUASH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_IQUASH_REGION }}
      - name: Inspect OCR containers
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command             --instance-ids "${{ vars.AWS_IQUASH_INSTANCE_ID }}"             --document-name "AWS-RunShellScript"             --comment "Diagnose iQuash OCR latency"             --parameters 'commands=["echo ===PS===","docker ps --filter name=iquash- --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"","echo ===STATS===","docker stats --no-stream iquash-paddleocr iquash-docling || true","echo ===PADDLE===","docker logs --tail 200 iquash-paddleocr 2>&1 || true","echo ===DOCLING===","docker logs --tail 200 iquash-docling 2>&1 || true","echo ===HEALTH===","time curl -fsS http://iquash-paddleocr:8080/health || true","time curl -fsS http://iquash-docling:8080/health || true"]'             --query 'Command.CommandId'             --output text)"
          for i in $(seq 1 30); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --query Status --output text 2>/dev/null || true)"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then break; fi
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_IQUASH_INSTANCE_ID }}" --output json
